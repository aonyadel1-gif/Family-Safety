<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>لوحة أمين الأسرة</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@600;700&family=Aref+Ruqaa:wght@400;700&family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
:root{--bg:#f6f3ea;--card:#fff;--ink:#1f2a44;--mute:#5d6680;--pri:#1f3a6e;--gold:#c8962e;--line:#e6dfcf;--red:#b3261e;--ok:#1e7a3c}
@media (prefers-color-scheme:dark){:root{--bg:#121a2e;--card:#1b2542;--ink:#f1ede2;--mute:#a9b2cc;--pri:#8fb0ee;--gold:#e0b24e;--line:#2c3860;--red:#ff8a80;--ok:#6fdc96}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',Tahoma,Arial,sans-serif;line-height:1.7}
.wrap{max-width:1100px;margin:auto;padding:16px}h1{font-family:'El Messiri','IBM Plex Sans Arabic',sans-serif;font-size:24px;margin:0;color:var(--pri)}h3{margin:18px 0 8px;color:var(--pri)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
input,select,button{font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button{cursor:pointer;font-weight:700}button.on,.p{background:var(--pri);color:var(--bg);border:0}.g{background:var(--gold);border:0;color:#1a1a1a}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tabs,.bar,.stats{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}.bar input{flex:1;min-width:180px}
.st{flex:1;min-width:120px;text-align:center}.st b{display:block;font-size:28px;color:var(--pri)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px;min-width:820px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}th{color:var(--mute);font-size:13px}
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--line);display:block;flex:none}
.tag{padding:2px 10px;border-radius:99px;font-size:12px;background:var(--line);white-space:nowrap}.tag.accepted{background:#d8f1e0;color:var(--ok)}.tag.t{background:var(--gold);color:#1a1a1a}
a{color:var(--pri)}.d{color:var(--red)}#err{color:var(--red);min-height:24px}.em{text-align:center;color:var(--mute)}
#login{max-width:340px;margin:12vh auto}#login input{width:100%;margin-bottom:10px}
.bd{display:flex;align-items:center;gap:12px;margin-bottom:8px;padding:10px 14px}.bd .dt{min-width:58px;text-align:center;font-weight:800;font-size:20px;color:var(--gold);direction:ltr}
.bd small{display:block;color:var(--mute)}.bd .sp{flex:1}.bd.today{border:2px solid var(--gold)}
.mh{border-bottom:2px solid var(--gold);padding-bottom:4px}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);padding:18px;width:min(560px,94vw);max-height:90vh;overflow:auto}dialog::backdrop{background:rgba(0,0,0,.55)}
dialog form{display:grid;gap:10px;grid-template-columns:1fr 1fr}dialog label{display:grid;gap:3px;font-size:13px;font-weight:700}dialog .f{grid-column:1/-1}
dialog input,dialog select,dialog textarea{width:100%;font:inherit;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.nt{border-inline-start:3px solid var(--gold);padding:6px 10px;margin:8px 0;background:var(--bg);border-radius:8px}.nt small{color:var(--mute)}
.ban{background:linear-gradient(135deg,var(--gold),#f3d27a);color:#1a1a1a;border-radius:14px;padding:12px 16px;margin:12px 0;font-weight:700}.ban a{color:#1a1a1a}
.it{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px;padding:12px 14px}.it .bx{min-width:62px;text-align:center;font-weight:800;color:var(--gold);line-height:1.3}.it .bx b{display:block;font-size:24px}
.it .gr{flex:1;min-width:0}.it .gr small{display:block;color:var(--mute)}.it .ac{display:flex;gap:6px;flex-wrap:wrap}
.th{width:84px;height:64px;border-radius:10px;object-fit:cover;background:var(--line);flex:none;display:grid;place-items:center;color:var(--mute);font-size:22px}
.gy{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.gy .card{padding:10px;display:grid;gap:6px}.gy .th{width:100%;height:130px}
.tag.red{background:#fde3e0;color:#b3261e}.tag.ok{background:#d8f1e0;color:var(--ok)}.badge{background:var(--red);color:#fff;border-radius:99px;padding:0 8px;font-size:12px;margin-inline-start:4px}
.pr{border-inline-start:4px solid var(--gold)}.pr.done{opacity:.65;border-inline-start-color:var(--ok)}
.hint{background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;color:var(--mute);font-size:13px}
@media(max-width:520px){dialog form{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<div id="login" class="card">
<h1>🔐 دخول أمين الأسرة</h1><p class="d" id="err"></p>
<input id="em" type="email" placeholder="الإيميل" autocomplete="username">
<input id="pw" type="password" placeholder="كلمة المرور" autocomplete="current-password">
<button class="p" id="go" style="width:100%">دخول</button>
</div>
<div id="app" hidden>
<div class="top"><h1>📊 لوحة أمين أسرة آڤا مينا</h1><div><button id="rf">تحديث ↻</button> <button id="out">خروج</button></div></div>
<div class="tabs" id="tabs"></div>
<div id="ban"></div>
<div id="main"></div>
</div>
</div>
<dialog id="dlg"></dialog>
<script>
var SUPABASE_URL=(window.AVA_CONFIG||{}).url||'', SUPABASE_KEY=(window.AVA_CONFIG||{}).key||'';
if(!SUPABASE_URL){document.getElementById('err').textContent='لسه محطتش الرابط والمفتاح في ملف config.js';throw new Error('no config')}
var sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),all=[],urls={};
var $=function(i){return document.getElementById(i)};
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML}
var MN=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
var DEPTS=['نظم معلومات الأعمال (BIS)','محاسبة والتمويل دولي (IAF)','الأسواق والمنشآت المالية (FMI)'];
var YO=['الأولى','الثانية','الثالثة','الرابعة'];
var TABS=[['over','📊 نظرة عامة'],['bd','🎂 أعياد الميلاد'],['yr','🎓 الفرق'],['dp','🏛️ الأقسام'],['fu','🤝 الافتقاد'],['all','👥 كل الأعضاء'],['sg','💡 الاقتراحات'],['pr','🙏 طلبات الصلاة'],['ev','📅 الفعاليات'],['cp','🏆 المسابقات'],['ar','🗂️ الأرشيف'],['pl','🗳️ التصويت'],['ph','📸 الصور بالشهور'],['stf','🛡️ الأمناء']];
var st={tab:'over',y:'',d:'',mode:'cal',q:'',fy:'',fs:'',fd:30,pf:'new'},notes=[],sugs=[],miss=false,events=[],comps=[],arch=[],prayers=[],miss3=false,polls=[],staffs=[],miss4=false,qres=[],miss5=false,DL=document.getElementById('dlg');
function ea(s){return esc(s).replace(/"/g,'&quot;')}
function greet(m){return 'كل سنة وانت طيب يا '+m.full_name.split(' ')[0]+' ❤️\nربنا يفرّح قلبك ويبارك حياتك ويحفظك قريب منه.\nأسرة آڤا مينا'}
function nc(id){return notes.filter(function(n){return n.member_id===id}).length}
function lastC(id){var n=notes.find(function(x){return x.member_id===id});return n?n.created_at:null}
function needs(d){var lim=Date.now()-d*864e5;return all.map(function(m){return{m:m,l:lastC(m.id)}}).filter(function(x){return !x.l||new Date(x.l).getTime()<lim}).sort(function(a,c){return (a.l?new Date(a.l).getTime():0)-(c.l?new Date(c.l).getTime():0)})}
function dt(s){return new Date(s).toLocaleDateString('ar-EG',{day:'numeric',month:'long',year:'numeric'})}
function ban(){var t=bdList().filter(function(x){return x.b.days===0}),np=prayers.filter(function(p){return p.status==='new'}).length;$('ban').innerHTML=(np?'<div class="ban">🙏 عندك '+np+' طلب صلاة جديد <a href="#" data-go="pr">(افتحها)</a></div>':'')+(t.length?'<div class="ban">🎉 النهاردة عيد ميلاد: '+t.map(function(x){return esc(x.m.full_name)+' <a target="_blank" rel="noopener" href="'+wa(x.m.phone,greet(x.m))+'">(ابعت تهنئة)</a>'}).join(' • ')+'</div>':'')}
function fuTab(){if(miss)return '<p class="em">شغّل ملف update-2.sql في Supabase الأول.</p>';var l=needs(st.fd);
 return '<div class="bar"><span>اللي ماتفتقدش من آخر</span><select id="fd">'+[14,30,60,90].map(function(d){return '<option value="'+d+'"'+(st.fd===d?' selected':'')+'>'+d+' يوم</option>'}).join('')+'</select><b>'+l.length+' عضو</b></div>'+(l.map(function(x){var m=x.m;return '<div class="card bd">'+ava(m)+'<div><b>'+esc(m.full_name)+'</b><small>'+esc(m.year)+' / '+esc(m.department)+' • '+(x.l?'آخر افتقاد: '+dt(x.l):'لسه ماتفتقدش')+'</small></div><div class="sp"></div><a target="_blank" rel="noopener" href="'+wa(m.phone,'سلام يا '+m.full_name.split(' ')[0]+' ❤️ وحشتنا، عامل إيه؟')+'">واتساب</a><button data-a="nt" data-id="'+m.id+'">📝 سجّل متابعة</button></div>'}).join('')||'<p class="em">كله متفتقد 👏</p>')}
function sgTab(){if(miss)return '<p class="em">شغّل ملف update-2.sql في Supabase الأول.</p>';return '<h3>💡 اقتراحات الأعضاء (بدون أسماء) — '+sugs.length+'</h3>'+(sugs.map(function(s){return '<div class="card nt"><div style="white-space:pre-wrap">'+esc(s.body)+'</div><small>'+dt(s.created_at)+'</small> <button class="d" data-a="ds" data-id="'+s.id+'">حذف</button></div>'}).join('')||'<p class="em">لسه مفيش اقتراحات.</p>')}
function edF(m){var o=function(v){return '<option'+(v===m.year?' selected':'')+'>'+esc(v)+'</option>'};
 return '<h3 style="margin-top:0">✏️ تعديل بيانات العضو</h3><form id="ef" data-id="'+m.id+'"><label class="f">الاسم<input name="full_name" required value="'+ea(m.full_name)+'"></label><label>الهاتف<input name="phone" required value="'+ea(m.phone)+'"></label><label>Email<input name="email" value="'+ea(m.email)+'"></label><label>الفرقة<select name="year">'+(m.year&&YO.indexOf(m.year)<0?o(m.year):'')+YO.map(o).join('')+'</select></label><label>القسم<select name="department">'+DEPTS.concat(m.department&&DEPTS.indexOf(m.department)<0?[m.department]:[]).map(function(d){return '<option'+(d===m.department?' selected':'')+'>'+esc(d)+'</option>'}).join('')+'</select></label><label>الشعبة<select name="section"><option value="">-</option><option'+(m.section==='عربي'?' selected':'')+'>عربي</option><option'+(m.section==='إنجليزي'?' selected':'')+'>إنجليزي</option></select></label><label>السكن<input name="housing_name" value="'+ea(m.housing_name)+'"></label><label>وصف السكن<input name="housing_desc" value="'+ea(m.housing_desc)+'"></label><label>تاريخ الميلاد<input name="birth_date" type="date" value="'+ea(m.birth_date)+'"></label><label>سنة الانضمام<input name="joined_year" type="number" value="'+ea(m.joined_year)+'"></label><label class="f">مهارات<input name="skills" value="'+ea(m.skills)+'"></label><label class="f"><span><input type="checkbox" name="prev_service" style="width:auto"'+(m.prev_service?' checked':'')+'> شارك في خدمة/لجنة قبل كده</span></label><div class="f"><button class="p" type="submit">حفظ</button> <button type="button" data-a="cl">إلغاء</button></div></form>'}
var K={call:'📞 اتصال',visit:'🏠 زيارة',meet:'🤝 لقاء',other:'📝 أخرى'};
function ntF(m){var l=notes.filter(function(n){return n.member_id===m.id});
 return '<h3 style="margin-top:0">📝 متابعة: '+esc(m.full_name)+'</h3><form id="nf" data-id="'+m.id+'" style="grid-template-columns:1fr"><label>النوع<select name="kind">'+Object.keys(K).map(function(k){return '<option value="'+k+'">'+K[k]+'</option>'}).join('')+'</select></label><label>الملاحظة<textarea name="note" rows="3" required placeholder="اتصلت بيه، ظروفه، محتاج إيه..."></textarea></label><div><button class="p" type="submit">إضافة</button> <button type="button" data-a="cl">إغلاق</button></div></form><h3>السجل ('+l.length+')</h3>'+(l.map(function(n){return '<div class="nt"><b>'+(K[n.kind]||'')+'</b> <small>'+dt(n.created_at)+'</small> <button class="d" data-a="dn" data-id="'+n.id+'">حذف</button><div style="white-space:pre-wrap">'+esc(n.note)+'</div></div>'}).join('')||'<p class="em">مفيش متابعات لسه.</p>')}
DL.addEventListener('click',function(e){if(e.target===DL)DL.close()});
document.addEventListener('click',async function(e){var b=e.target.closest('button');if(!b||!b.dataset.a)return;var D=b.dataset,m=all.find(function(x){return x.id===D.id});
 if(D.a==='ed'){DL.innerHTML=edF(m);DL.showModal()}
 else if(D.a==='nt'){DL.innerHTML=ntF(m);DL.dataset.mid=m.id;if(!DL.open)DL.showModal()}
 else if(D.a==='cl'){DL.close()}
 else if(D.a==='dn'){if(!confirm('حذف الملاحظة؟'))return;var r=await sb.from('notes').delete().eq('id',D.id);if(!r.error){notes=notes.filter(function(n){return n.id!==D.id});DL.innerHTML=ntF(all.find(function(x){return x.id===DL.dataset.mid}));draw()}}
 else if(D.a==='ds'){if(!confirm('حذف الاقتراح؟'))return;var r2=await sb.from('suggestions').delete().eq('id',D.id);if(!r2.error){sugs=sugs.filter(function(s){return s.id!==D.id});draw()}}});
document.addEventListener('submit',async function(e){e.preventDefault();var f=e.target,id=f.dataset.id,g=function(k){return f.elements[k].value.trim()};
 if(f.id==='ef'){var row={full_name:g('full_name'),phone:g('phone'),email:g('email')||null,year:g('year'),department:g('department'),section:g('section')||null,housing_name:g('housing_name')||null,housing_desc:g('housing_desc')||null,birth_date:g('birth_date')||null,joined_year:g('joined_year')?+g('joined_year'):null,skills:g('skills')||null,prev_service:f.elements.prev_service.checked};
  var r=await sb.from('members').update(row).eq('id',id);if(r.error){alert('فشل الحفظ: '+r.error.message);return}Object.assign(all.find(function(x){return x.id===id}),row);DL.close();draw()}
 else if(f.id==='nf'){var r2=await sb.from('notes').insert({member_id:id,kind:g('kind'),note:g('note')}).select().single();if(r2.error){alert('فشل الحفظ: '+r2.error.message);return}notes.unshift(r2.data);DL.innerHTML=ntF(all.find(function(x){return x.id===id}));draw()}});

/* ===== تحديث 3: فعاليات / مسابقات / أرشيف / صلاة ===== */
function today(){return new Date().toLocaleDateString('en-CA',{timeZone:'Africa/Cairo'})}
var EK={meeting:'اجتماع',trip:'رحلة',carnival:'كرنفال',day:'يوم أسرة',service:'خدمة',other:'أخرى'};
function pub(p){return sb.storage.from('site-media').getPublicUrl(p).data.publicUrl}
function th(p,ic){return p?'<img class="th" src="'+ea(pub(p))+'" alt="" loading="lazy">':'<div class="th">'+ic+'</div>'}
function need3(){return miss3?'<p class="em">شغّل ملف update-3.sql في Supabase الأول (SQL Editor ← Run).</p>':''}
function shrinkImg(file,max){return new Promise(function(res){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(function(b){res(b)},'image/jpeg',.84)};im.onerror=function(){res(null)};im.src=r.result};r.onerror=function(){res(null)};r.readAsDataURL(file)})}
async function upImg(file,folder){var b=await shrinkImg(file,1500);if(!b)throw new Error('الصورة مش مقروءة');var p=folder+'/'+crypto.randomUUID()+'.jpg',r=await sb.storage.from('site-media').upload(p,b,{contentType:'image/jpeg'});if(r.error)throw r.error;return p}
async function rmImg(p){if(p)await sb.storage.from('site-media').remove([p])}

function evTab(){if(miss3)return need3();var t=today(),up=events.filter(function(e){return (e.end_date||e.event_date)>=t}).sort(function(a,c){return a.event_date.localeCompare(c.event_date)}),old=events.filter(function(e){return (e.end_date||e.event_date)<t}).sort(function(a,c){return c.event_date.localeCompare(a.event_date)});
 var card=function(e,past){var p=e.event_date.split('-');return '<div class="card it"><div class="bx"><b>'+(+p[2])+'</b>'+MN[+p[1]-1]+'</div><div class="gr"><b>'+esc(e.title)+'</b> <span class="tag">'+esc(EK[e.kind]||'أخرى')+'</span>'+(e.end_date&&e.end_date!==e.event_date?' <span class="tag">لحد '+esc(e.end_date)+'</span>':'')+'<small>'+esc([e.event_time,e.place].filter(Boolean).join(' • '))+'</small>'+(e.details?'<small>'+esc(e.details)+'</small>':'')+'</div><div class="ac"><button data-a="eve" data-id="'+e.id+'">تعديل</button><button class="d" data-a="evd" data-id="'+e.id+'">حذف</button></div></div>'};
 return '<div class="bar"><button class="g" data-a="evn">＋ فعالية جديدة</button><span class="hint">الفعالية بتظهر في الموقع لحد ما يعدي تاريخها، وبعدها بتختفي لوحدها.</span></div><h3>القادمة ('+up.length+')</h3>'+(up.map(function(e){return card(e)}).join('')||'<p class="em">مفيش فعاليات قادمة. أضف أول فعالية.</p>')+(old.length?'<h3>انتهت (مخفية من الموقع) ('+old.length+')</h3>'+old.map(function(e){return card(e,1)}).join(''):'')}
function cpTab(){if(miss3)return need3();
 return '<div class="bar"><button class="g" data-a="cpn">＋ مسابقة جديدة</button></div>'+(comps.map(function(c){var cl=c.status==='closed';return '<div class="card it">'+th(c.image_path,'🏆')+'<div class="gr"><b>'+esc(c.title)+'</b> <span class="tag '+(cl?'red':'ok')+'">'+(cl?'انتهت':'مفتوحة')+'</span><small>'+esc([c.prize&&'الجايزة: '+c.prize,c.deadline&&'آخر موعد: '+c.deadline].filter(Boolean).join(' • '))+'</small>'+(c.description?'<small>'+esc(c.description.slice(0,140))+(c.description.length>140?'…':'')+'</small>':'')+'</div><div class="ac"><button data-a="cpt" data-id="'+c.id+'">'+(cl?'افتحها':'اقفلها')+'</button><button data-a="cpe" data-id="'+c.id+'">تعديل</button><button class="d" data-a="cpd" data-id="'+c.id+'">حذف</button></div></div>'}).join('')||'<p class="em">لسه مفيش مسابقات. أضف أول مسابقة.</p>')+qrBlock()}
function arTab(){if(miss3)return need3();var ys=[];arch.forEach(function(a){if(ys.indexOf(a.year)<0)ys.push(a.year)});ys.sort(function(a,c){return c-a});
 return '<div class="bar"><button class="g" data-a="arn">＋ إضافة للأرشيف</button></div>'+(ys.map(function(y){return '<h3>'+y+'</h3><div class="gy">'+arch.filter(function(a){return a.year===y}).map(function(a){return '<div class="card">'+th(a.image_path,'🗂️')+'<b>'+esc(a.title)+'</b>'+(a.description?'<small>'+esc(a.description.slice(0,90))+'</small>':'')+'<div class="ac"><button data-a="are" data-id="'+a.id+'">تعديل</button><button class="d" data-a="ard" data-id="'+a.id+'">حذف</button></div></div>'}).join('')+'</div>'}).join('')||'<p class="em">الأرشيف فاضي. أضف أول ذكرى.</p>')}

 [[80,80],[W-80,80],[80,H-80],[W-80,H-80]].forEach(function(p){c.fillStyle=gold;c.beginPath();c.arc(p[0],p[1],14,0,7);c.fill();c.fillStyle=navy;c.beginPath();c.arc(p[0],p[1],6,0,7);c.fill()});
 c.direction='rtl';c.textAlign='center';c.textBaseline='alphabetic';

 c.fillStyle=navy;c.font='700 34px "El Messiri"';c.fillText('أسرة آڤا مينا',W/2,330);
 c.font='600 22px "IBM Plex Sans Arabic"';c.fillStyle='#566079';c.fillText('جامعيين علوم مالية وإدارية بسوهاج',W/2,364);
 c.fillStyle=gold;c.font='700 104px "Aref Ruqaa"';c.fillText('شهادة تقدير',W/2,500);

 c.fillStyle='#17203a';c.font='600 32px "IBM Plex Sans Arabic"';c.fillText('تقدّم أسرة آڤا مينا هذه الشهادة تقديراً وتشجيعاً لـ',W/2,600);
 c.fillStyle=navy;var fs=92;c.font='700 '+fs+'px "El Messiri"';while(c.measureText(name).width>W-420&&fs>40){fs-=4;c.font='700 '+fs+'px "El Messiri"'}
 c.fillText(name,W/2,716);
 c.strokeStyle=gold;c.lineWidth=2;c.beginPath();c.moveTo(W/2-380,745);c.lineTo(W/2+380,745);c.stroke();
 c.fillStyle='#17203a';c.font='600 32px "IBM Plex Sans Arabic"';
 var RK=['الأول','التاني','التالت'];
 var txt=(rank&&rank<=3?'على حصوله على المركز '+RK[rank-1]+' ':'على تفوقه ')+'في مسابقة سفر التثنية بدرجة '+String(score).replace(/\d/g,function(d){return '٠١٢٣٤٥٦٧٨٩'[d]})+' من '+String(total).replace(/\d/g,function(d){return '٠١٢٣٤٥٦٧٨٩'[d]});

 c.fillStyle=gold;c.font='400 36px "Amiri"';c.fillText('اجْتَهِدْ أَنْ تُقِيمَ نَفْسَكَ للهِ مُزَكّىً، عَامِلاً لاَ يُخْزَى، مُفَصِّلاً كَلِمَةَ الْحَقِّ بِالاسْتِقَامَةِ',W/2,y+30);
 c.fillStyle='#566079';c.font='600 24px "IBM Plex Sans Arabic"';c.fillText('٢ تيموثاوس ٢:١٥',W/2,y+70);
 var sy=H-190;
 [[W/2+380,'أبونا ديفيد وليم'],[W/2-380,'أمناء أسرة آڤا مينا']].forEach(function(s,i){
  c.fillStyle=navy;c.font=(i?'700 40px "El Messiri"':'400 58px "Aref Ruqaa"');c.fillText(s[1],s[0],sy-20);

 if(wk.length)al.push('🎂 أعياد ميلاد الأسبوع: '+wk.map(function(x){return esc(x.m.full_name)+(x.b.days===0?' (النهاردة)':' (بعد '+x.b.days+' يوم)')}).join('، '));
 if(nop)al.push('📷 <b>'+nop+'</b> عضو من غير صورة');
 return (al.length?'<div class="card"><b>تنبيهات</b>'+al.map(function(t){return '<div style="margin-top:8px">'+t+'</div>'}).join('')+'</div>':'')+_over()};

/* ---- الأمناء ---- */
function stfTab(){
 var me=(window.__me||'').toLowerCase();
 return '<div class="bar"><span class="hint">أي إيميل هنا يقدر يدخل لوحة الأدمن ويدير كل حاجة. لازم الأول يكون له حساب في Supabase (Authentication ← Users ← Add user)</span></div><div class="card"><b>الأمناء ('+staffs.length+')</b>'+staffs.map(function(s){return '<div class="it" style="border:0;padding:8px 0;display:flex;justify-content:space-between;gap:8px;align-items:center"><span dir="ltr">'+esc(s.email)+(s.email.toLowerCase()===me?' <span class="tag ok">أنت</span>':'')+'</span>'+(s.email.toLowerCase()===me?'':'<button class="d" data-a="stfd" data-id="'+ea(s.email)+'">شيل</button>')+'</div>'}).join('')+'<form id="stff" style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><input name="email" type="email" required dir="ltr" placeholder="email@example.com" style="flex:1;min-width:200px"><button class="p" type="submit">＋ إضافة أمين</button></form></div>'}
document.addEventListener('submit',async function(e){
 if(e.target.id!=='stff')return;e.preventDefault();
 var em=e.target.elements.email.value.trim().toLowerCase();if(!em)return;
 var r=await sb.from('staff').insert({email:em});
 if(r.error){alert(r.error.code==='23505'?'الإيميل ده مضاف قبل كده':'فشل الإضافة: '+r.error.message);return}
 staffs.push({email:em});staffs.sort(function(a,b){return a.email.localeCompare(b.email)});draw()});
document.addEventListener('click',async function(e){
 var b=e.target.closest('button');if(!b||b.dataset.a!=='stfd')return;
 if(!confirm('تشيل '+b.dataset.id+' من الأمناء؟ مش هيقدر يدخل اللوحة تاني'))return;
 var r=await sb.from('staff').delete().eq('email',b.dataset.id);
 if(r.error){alert(r.error.message);return}
 staffs=staffs.filter(function(s){return s.email!==b.dataset.id});draw()});

function nk(s){return (s||'').trim().replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,' ')}
function bdi(m){if(!m.birth_date)return null;var p=m.birth_date.split('-'),mo=+p[1],d=+p[2],t=new Date(),y=t.getFullYear(),td=new Date(y,t.getMonth(),t.getDate()),n=new Date(y,mo-1,d);if(n<td)n=new Date(y+1,mo-1,d);return{mo:mo,d:d,days:Math.round((n-td)/864e5),age:n.getFullYear()-(+p[0])}}
function wa(p,t){return 'https://wa.me/'+String(p||'').replace(/\D/g,'').replace(/^0/,'20')+(t?'?text='+encodeURIComponent(t):'')}
function ava(m){var u=urls[m.photo_path];return u?'<img class="av" src="'+u+'" alt="">':'<div class="av"></div>'}
function row(m){return '<tr><td>'+ava(m)+'</td><td><b>'+esc(m.full_name)+'</b><br><small>'+esc(m.email)+'</small></td><td dir="ltr"><a target="_blank" rel="noopener" href="'+wa(m.phone)+'">'+esc(m.phone)+'</a></td><td>'+esc(m.year)+' / '+esc(m.department)+(m.section?' <span class="tag">'+esc(m.section)+'</span>':'')+(m.housing_name?'<br><small>🏠 '+esc(m.housing_name)+(m.housing_desc?' — '+esc(m.housing_desc):'')+'</small>':'')+'</td><td>'+esc(m.birth_date)+'</td><td>'+esc(m.joined_year)+'</td><td>'+esc(m.skills)+'</td><td>'+(m.prev_service?'نعم':'لا')+'</td><td><span class="tag '+m.status+'">'+(m.status==='accepted'?'تم القبول':'جديد')+'</span></td><td style="white-space:nowrap">'+(m.status==='accepted'?'':'<button data-a="ok" data-id="'+m.id+'">قبول</button> ')+'<button data-a="ed" data-id="'+m.id+'">تعديل</button> <button data-a="nt" data-id="'+m.id+'">📝 متابعة'+(nc(m.id)?' ('+nc(m.id)+')':'')+'</button> <button class="d" data-a="del" data-id="'+m.id+'">حذف</button></td></tr>'}
function tbl(l){return l.length?'<div class="card tw"><table><thead><tr><th>صورة</th><th>الاسم</th><th>الهاتف</th><th>الفرقة / القسم</th><th>الميلاد</th><th>الانضمام</th><th>مهارات</th><th>خدمة سابقة</th><th>الحالة</th><th></th></tr></thead><tbody>'+l.map(row).join('')+'</tbody></table></div>':'<p class="em">مفيش أعضاء هنا لسه.</p>'}
function chips(items,attr,cur){return '<div class="bar">'+items.map(function(x){return '<button data-'+attr+'="'+esc(x[0])+'" class="'+(cur===x[0]?'on':'')+'">'+esc(x[1])+' ('+x[2]+')</button>'}).join('')+'</div>'}
function bdCard(x){var b=x.b,m=x.m,t=b.days===0?'<span class="tag t">🎉 النهاردة</span>':(b.days<=30?'<span class="tag">بعد '+b.days+' يوم</span>':'');return '<div class="card bd'+(b.days===0?' today':'')+'"><div class="dt">'+b.d+'/'+b.mo+'</div>'+ava(m)+'<div><b>'+esc(m.full_name)+'</b><small>'+esc(m.year)+' / '+esc(m.department)+' • هيكمل '+b.age+' سنة</small></div><div class="sp"></div>'+t+'<a class="tag t" target="_blank" rel="noopener" href="'+wa(m.phone,greet(m))+'">🎂 تهنئة</a></div>'}
function bdList(){return all.map(function(m){return{m:m,b:bdi(m)}}).filter(function(x){return x.b})}
function groups(key){var g={};all.forEach(function(m){var k=nk(m[key]);if(!k)return;(g[k]=g[k]||{l:m[key].trim(),n:[]}).n.push(m)});return g}
function over(){var b=bdList().sort(function(a,c){return a.b.days-c.b.days}),y=groups('year');
 return '<div class="stats"><div class="card st"><b>'+all.length+'</b>إجمالي الأعضاء</div><div class="card st"><b>'+all.filter(function(m){return m.status==='new'}).length+'</b>طلبات جديدة</div><div class="card st"><b>'+b.filter(function(x){return x.b.days===0}).length+'</b>أعياد ميلاد النهاردة</div><div class="card st"><b>'+needs(30).length+'</b>محتاجين افتقاد (+30 يوم)</div><div class="card st"><b>'+prayers.filter(function(p){return p.status==='new'}).length+'</b>طلبات صلاة جديدة</div><div class="card st"><b>'+events.filter(function(e){return (e.end_date||e.event_date)>=today()}).length+'</b>فعاليات قادمة</div>'+Object.keys(y).map(function(k){return '<div class="card st"><b>'+y[k].n.length+'</b>الفرقة '+esc(y[k].l)+'</div>'}).join('')+'</div><h3>🎂 أقرب أعياد الميلاد</h3>'+(b.slice(0,5).map(bdCard).join('')||'<p class="em">لسه مفيش تواريخ ميلاد.</p>')}
function bdTab(){var l=bdList(),no=all.length-l.length;
 if(st.mode==='near')l.sort(function(a,c){return a.b.days-c.b.days});else l.sort(function(a,c){return a.b.mo-c.b.mo||a.b.d-c.b.d||a.m.full_name.localeCompare(c.m.full_name,'ar')});
 var h='<div class="bar"><button data-mode="cal" class="'+(st.mode==='cal'?'on':'')+'">ترتيب التقويم (1/1 ← 31/12)</button><button data-mode="near" class="'+(st.mode==='near'?'on':'')+'">الأقرب أولاً</button></div>',last=0;
 l.forEach(function(x){if(st.mode==='cal'&&x.b.mo!==last){last=x.b.mo;h+='<h3 class="mh">'+MN[last-1]+'</h3>'}h+=bdCard(x)});
 return h+(l.length?'':'<p class="em">لسه مفيش تواريخ ميلاد.</p>')+(no?'<p class="em">'+no+' عضو من غير تاريخ ميلاد.</p>':'')}
function grpTab(key,cur,attr){var g=groups(key),ks=Object.keys(g);
 if(key==='year')ks.sort(function(a,c){var i=YO.map(nk).indexOf(a),j=YO.map(nk).indexOf(c);return (i<0?9:i)-(j<0?9:j)});else ks.sort(function(a,c){return g[c].n.length-g[a].n.length});
 var h=chips(ks.map(function(k){return [k,g[k].l,g[k].n.length]}),attr,cur);
 if(!ks.length)return h+'<p class="em">لسه مفيش أعضاء.</p>';if(!g[cur])return h+'<p class="em">اختار من فوق.</p>';
 var o=key==='year'?'department':'year';return h+tbl(g[cur].n.slice().sort(function(a,c){return nk(a[o]).localeCompare(nk(c[o]),'ar')||a.full_name.localeCompare(c.full_name,'ar')}))}
function allTab(){var ys=Object.keys(groups('year'));return '<div class="bar"><input id="q" placeholder="ابحث بالاسم أو الهاتف أو القسم" value="'+esc(st.q)+'"><select id="fy"><option value="">كل الفرق</option>'+ys.map(function(k){var v=groups('year')[k].l;return '<option'+(st.fy===v?' selected':'')+'>'+esc(v)+'</option>'}).join('')+'</select><select id="fs"><option value="">كل الحالات</option><option value="new"'+(st.fs==='new'?' selected':'')+'>جديد</option><option value="accepted"'+(st.fs==='accepted'?' selected':'')+'>تم القبول</option></select><button class="g" id="csv">تصدير Excel</button></div><div id="tb">'+tbl(view())+'</div>'}
function view(){var q=st.q.trim().toLowerCase();return all.filter(function(m){return(!st.fy||m.year===st.fy)&&(!st.fs||m.status===st.fs)&&(!q||[m.full_name,m.phone,m.department,m.section,m.housing_name].join(' ').toLowerCase().indexOf(q)>-1)})}
function draw(){ban();$('tabs').innerHTML=TABS.map(function(t){var n=t[0]==='pr'?prayers.filter(function(p){return p.status==='new'}).length:0;return '<button data-tab="'+t[0]+'" class="'+(st.tab===t[0]?'on':'')+'">'+t[1]+(n?'<span class="badge">'+n+'</span>':'')+'</button>'}).join('');
 $('main').innerHTML={over:over,bd:bdTab,yr:function(){return grpTab('year',st.y,'y')},dp:function(){return grpTab('department',st.d,'d')},all:allTab,fu:fuTab,sg:sgTab,pr:prTab,ev:evTab,cp:cpTab,ar:arTab,pl:plTab,ph:phTab,stf:stfTab}[st.tab]()}
async function boot(){var s=(await sb.auth.getSession()).data.session;window.__me=(s&&s.user&&s.user.email)||'';$('login').hidden=!!s;$('app').hidden=!s;if(s)load()}
async function load(){var r=await sb.from('members').select('*').order('created_at',{ascending:false}).limit(1000);
 if(r.error){$('main').innerHTML='<p class="em">تعذر تحميل البيانات: '+esc(r.error.message)+'</p>';return}
 all=r.data;var p=all.filter(function(m){return m.photo_path}).map(function(m){return m.photo_path});
 if(p.length){var s=await sb.storage.from('member-photos').createSignedUrls(p,3600);(s.data||[]).forEach(function(x){urls[x.path]=x.signedUrl})}
 var n=await sb.from('notes').select('*').order('created_at',{ascending:false}).limit(5000),g=await sb.from('suggestions').select('*').order('created_at',{ascending:false}).limit(500);
 miss=!!(n.error||g.error);notes=n.data||[];sugs=g.data||[];
 var x=await Promise.all([sb.from('events').select('*').order('event_date'),sb.from('competitions').select('*').order('created_at',{ascending:false}),sb.from('archive_items').select('*').order('year',{ascending:false}).order('created_at',{ascending:false}),sb.from('prayers').select('*').order('created_at',{ascending:false}).limit(1000)]);
 miss3=!!(x[0].error||x[1].error||x[2].error||x[3].error);events=x[0].data||[];comps=x[1].data||[];arch=x[2].data||[];prayers=x[3].data||[];await loadPolls();draw()}
$('go').onclick=async function(){var r=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});if(r.error){$('err').textContent='الإيميل أو كلمة المرور غلط';return}boot()};
$('out').onclick=async function(){await sb.auth.signOut();boot()};$('rf').onclick=load;
document.addEventListener('visibilitychange',function(){if(!document.hidden&&!$('app').hidden)load()});
document.addEventListener('click',async function(e){var b=e.target.closest('button');if(!b)return;var D=b.dataset;
 if(D.tab){st.tab=D.tab;draw()}else if(D.y!==undefined){st.y=D.y;draw()}else if(D.d!==undefined){st.d=D.d;draw()}else if(D.mode){st.mode=D.mode;draw()}
 else if(b.id==='csv'){csv()}
 else if(D.a==='ok'){var r=await sb.from('members').update({status:'accepted'}).eq('id',D.id);if(!r.error){all.find(function(x){return x.id===D.id}).status='accepted';draw()}}
 else if(D.a==='del'){var m=all.find(function(x){return x.id===D.id});if(!confirm('حذف '+m.full_name+' نهائياً؟'))return;var r2=await sb.from('members').delete().eq('id',D.id);if(!r2.error){if(m.photo_path)await sb.storage.from('member-photos').remove([m.photo_path]);all=all.filter(function(x){return x.id!==D.id});draw()}}});
document.addEventListener('input',function(e){var i=e.target.id;if(i==='q')st.q=e.target.value;else if(i==='fy')st.fy=e.target.value;else if(i==='fs')st.fs=e.target.value;else if(i==='fd'){st.fd=+e.target.value;draw();return}else return;$('tb').innerHTML=tbl(view())});
function csv(){var cols=[['full_name','الاسم'],['phone','الهاتف'],['email','Email'],['year','الفرقة'],['department','القسم'],['section','الشعبة'],['housing_name','السكن'],['housing_desc','وصف السكن'],['birth_date','تاريخ الميلاد'],['joined_year','سنة الانضمام'],['skills','مهارات'],['prev_service','خدمة سابقة'],['status','الحالة'],['created_at','تاريخ التسجيل']];
 var rows=[cols.map(function(c){return c[1]})].concat(view().map(function(m){return cols.map(function(c){return m[c[0]]})}));
 var t='\uFEFF'+rows.map(function(r){return r.map(function(x){return '"'+String(x==null?'':x).replace(/"/g,'""')+'"'}).join(',')}).join('\n');
 var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'}));a.download='members.csv';a.click()}
boot();
</script>
